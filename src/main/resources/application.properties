spring.application.name=user-service
spring.profiles.default=local
server.port=${SERVER_PORT:8081}
spring.docker.compose.enabled=false

spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/changelog-master.yaml

spring.cache.type=redis
spring.data.redis.repositories.enabled=false
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

services.auth.url=${AUTH_SERVICE_URL:http://localhost:8082}
services.internal.auth-password=${AUTH_SERVICE_INTERNAL_PASSWORD}
services.internal.order-password=${ORDER_SERVICE_INTERNAL_PASSWORD}