name: inno-bank-user-service

services:
  user-service:
    image: inno-bank-user-service:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081
      DB_HOST: postgres_data
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-users}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://host.docker.internal:8082}
      AUTH_SERVICE_INTERNAL_PASSWORD: ${AUTH_SERVICE_INTERNAL_PASSWORD:?Set AUTH_SERVICE_INTERNAL_PASSWORD in .env}
      ORDER_SERVICE_INTERNAL_PASSWORD: ${ORDER_SERVICE_INTERNAL_PASSWORD:?Set ORDER_SERVICE_INTERNAL_PASSWORD in .env}
    ports:
      - '127.0.0.1:${APP_PORT:-8081}:8081'
    depends_on:
      postgres_data:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres_data:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-users}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - '127.0.0.1:${DB_PORT:-5433}:5432'
    volumes:
      - user_db_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8-alpine
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  user_db_data: